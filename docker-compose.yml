services:
  db:
    image: postgres:16-alpine
    container_name: leads_scraper_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads_secret}
      POSTGRES_DB: ${POSTGRES_DB:-leads_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leads}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads_scraper_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leads}:${POSTGRES_PASSWORD:-leads_secret}@db:5432/${POSTGRES_DB:-leads_db}
      NODE_ENV: production
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  pgdata:
